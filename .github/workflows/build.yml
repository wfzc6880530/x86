name: Build OpenWrt

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  OPENWRT_VERSION: 24.10.5

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget

      - name: Download OpenWrt source
        run: |
          wget -q https://github.com/openwrt/openwrt/archive/refs/tags/v${OPENWRT_VERSION}.tar.gz
          tar -xzf v${OPENWRT_VERSION}.tar.gz
          mv openwrt-${OPENWRT_VERSION} openwrt

      - name: Configure feeds and target
        working-directory: openwrt
        run: |
          cp ../feeds.conf.default feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          git clone --depth=1 https://github.com/tonylee2022/luci-app-nezha-agent.git package/luci-app-nezha-agent
          cp ../config/x86_64.config .config
          make defconfig

      - name: Download package sources
        working-directory: openwrt
        run: make download -j$(nproc)

      - name: Build firmware
        working-directory: openwrt
        run: make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86_64
          path: openwrt/bin/targets/x86/64/
          if-no-files-found: error